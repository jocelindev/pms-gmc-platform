services:
  - type: web
    name: palladiumafrica-controltower
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py start.py database/init_database.py database/db.py
    startCommand: python start.py --host 0.0.0.0
    healthCheckPath: /api/health
    domains:
      - controltower.palladiumafrica.com
    envVars:
      - key: PMS_PUBLIC_APP_ORIGIN
        value: https://palladiumafrica-controltower.onrender.com
      - key: PMS_ALLOWED_CORS_ORIGINS
        value: https://pms-gmc-platform.onrender.com,https://palladiumafrica-controltower.onrender.com,https://controltower.palladiumafrica.com
      - key: PMS_KOBO_AUTO_SYNC_INTERVAL_SECONDS
        value: "120"
      - key: PMS_KOBO_AUTO_SYNC_STARTUP_DELAY_SECONDS
        value: "5"
      - key: PMS_KOBO_SERVER_URL
        value: https://kf.kobotoolbox.org
      - key: PMS_KOBO_REFERENCE_FORM_UID
        value: aJSryGjJv4Jzz9YRcP8D67
      - key: PMS_KOBO_OBJECTIVES_FORM_UID
        value: aNdbykKVWBW8KeprR5M2Uj
      - key: PMS_KOBO_CALCULATION_FORM_UID
        value: aCdB3YF8vSppFsVBroKm9W
      - key: PMS_KOBO_API_TOKEN
        sync: false
